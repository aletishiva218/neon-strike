name: Build Neon Strike APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare cache directory
        run: mkdir -p "$HOME/.buildozer"

      - name: Cache Android SDK and NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-docker-${{ hashFiles('buildozer.spec') }}-v3
          restore-keys: buildozer-docker-

      - name: Build APK inside kivy/buildozer Docker image
        run: |
          docker run --rm \
            --volume "$HOME/.buildozer:/home/user/.buildozer" \
            --volume "$PWD:/home/user/hostcwd" \
            kivy/buildozer:latest \
            android debug 2>&1 | tee build.log
        timeout-minutes: 60

      - name: Fix file permissions after Docker
        if: always()
        run: |
          sudo chown -R "$USER:$USER" bin/        2>/dev/null || true
          sudo chown -R "$USER:$USER" .buildozer/ 2>/dev/null || true

      - name: Show bin directory
        if: always()
        run: ls -la bin/ 2>/dev/null || echo "bin/ was not created — build failed"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonStrike-debug-apk
          path: bin/*.apk
          if-no-files-found: warn

      - name: Upload build log (always)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
